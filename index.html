<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 SKILLS TEST</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5">

  <h2>University of Mang Tomas</h2>

  <div class="login-box p-4 shadow mx-auto mt-4">
    <label>Username:</label>
    <input type="text" id="username" class="form-control mb-3">

    <label>Password:</label>
    <input type="text" id="password" class="form-control mb-3">

    <input type="button" id="login" value="Login" onclick="login()" class="btn btn-primary">
    <input type="button" id="refresh" value="Refresh" onclick="location.reload()" class="btn btn-danger">
    <input type="button" id="help" value="View Login Help" onclick="showHelp()" class="btn btn-info">
  </div>
<p id="output" class="mt-3 fw-bold"></p>

  <script src="main.js"></script>
</body>
</html>
